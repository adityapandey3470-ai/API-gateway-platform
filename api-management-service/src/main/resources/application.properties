spring.application.name=api-management-service
server.port=8082
info.app.name=api management service
info.app.description=API management service for managing APIs, users, and access control

spring.datasource.url=jdbc:mysql://localhost:3306/api_management_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=debug