<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KoreVane™ | Intelligent API Gateway & Control Plane</title>
  <meta name="description" content="KoreVane - Enterprise-grade multi-tenant API gateway, dynamic traffic routing, zero-trust policies, and telemetry control plane.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%236366f1'/><stop offset='100%25' stop-color='%2306b6d4'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='%230f172a'/><path d='M30 25 L50 45 L50 75 L30 55 Z' fill='url(%23g)'/><path d='M70 25 L50 45 L50 75 L70 55 Z' fill='url(%23g)' opacity='0.75'/><circle cx='50' cy='45' r='8' fill='%23ffffff'/></svg>">
  
  <!-- Fonts & Design System Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

  <!-- Ambient Light/Dark Background Mesh -->
  <div class="bg-ambient-mesh">
    <div class="mesh-orb-1"></div>
    <div class="mesh-orb-2"></div>
  </div>

  <!-- Initial Native Instagram-Style Splash Screen -->
  <div id="korevane-splash">
    <div class="splash-logo-container">
      <svg class="splash-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="splashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#06b6d4"/>
          </linearGradient>
          <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>
        <!-- KoreVane Outer Hex Shield -->
        <polygon points="50,6 90,26 90,74 50,94 10,74 10,26" stroke="url(#splashGrad)" stroke-width="4" fill="rgba(99, 102, 241, 0.08)" />
        <!-- Directional Vanes -->
        <path d="M26 34 L50 50 L50 78 L26 62 Z" fill="url(#splashGrad)" filter="url(#glowFilter)" />
        <path d="M74 34 L50 50 L50 78 L74 62 Z" fill="url(#splashGrad)" opacity="0.8" />
        <!-- Radiant Central Core -->
        <circle cx="50" cy="50" r="9" fill="#ffffff" filter="drop-shadow(0 0 8px #06b6d4)" />
        <circle cx="50" cy="50" r="4" fill="#6366f1" />
      </svg>
      <div class="splash-brand-text">KoreVane™</div>
      <div class="splash-tagline">Intelligent Microservices Gateway & Control Plane</div>
      <div class="splash-loader-bar">
        <div class="splash-loader-indicator"></div>
      </div>
    </div>
  </div>

  <!-- React Root Container -->
  <div id="root"></div>

  <!-- 1. Core API & Storage Layer -->
  <script src="js/api.js"></script>

  <!-- 2. Shared Reusable UI Components -->
  <script type="text/babel" src="js/components/Icons.jsx"></script>
  <script type="text/babel" src="js/components/SplashScreen.jsx"></script>
  <script type="text/babel" src="js/components/OnboardingTour.jsx"></script>
  <script type="text/babel" src="js/components/Toast.jsx"></script>
  <script type="text/babel" src="js/components/Navbar.jsx"></script>
  <script type="text/babel" src="js/components/Sidebar.jsx"></script>

  <!-- 3. Feature Modules -->
  <script type="text/babel" src="js/features/auth/LoginView.jsx"></script>
  <script type="text/babel" src="js/features/platform/OrganizationsView.jsx"></script>
  <script type="text/babel" src="js/features/platform/TenantAdminModal.jsx"></script>
  <script type="text/babel" src="js/features/tenant/RoutesView.jsx"></script>
  <script type="text/babel" src="js/features/tenant/RouteModal.jsx"></script>
  <script type="text/babel" src="js/features/tenant/RouteVersionsModal.jsx"></script>
  <script type="text/babel" src="js/features/tenant/AuditTrailView.jsx"></script>
  <script type="text/babel" src="js/features/gateway/GatewayRoutesView.jsx"></script>
  <script type="text/babel" src="js/features/guide/HowToUseView.jsx"></script>
  <script type="text/babel" src="js/features/settings/SettingsView.jsx"></script>

  <!-- 4. Root Orchestration App -->
  <script type="text/babel" src="js/App.jsx"></script>
</body>
</html>
